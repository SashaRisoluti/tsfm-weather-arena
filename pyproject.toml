[project]
name = "tsfm-weather-arena"
version = "0.1.0"
description = "Benchmark of time-series foundation models against an AI weather model for precipitation forecasting over Northern Italy and the Alps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SashaRisoluti" }]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arena"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
