[project]
name = "tsfm-weather-arena"
version = "0.1.0"
description = "Benchmark of time-series foundation models against an AI weather model for precipitation forecasting over Northern Italy and the Alps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SashaRisoluti" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "dask>=2026.8.0",
    "eccodes>=2.50.1",
    "eccodeslib>=2.50.0.34 ; sys_platform != 'win32'",
    "fsspec>=2026.9.0",
    "hydra-core>=1.3.8",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "typer>=0.29.2",
    "xarray>=2026.9.0",
    "zarr>=3.1.6",
]

[project.scripts]
arena = "arena.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arena"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Plot calls read better on one line.
"notebooks/*.ipynb" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["fsspec.*", "eccodes.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The synthetic stores carry inline consolidated metadata, like the real ones.
filterwarnings = ["ignore:Consolidated metadata is currently not part in the Zarr format 3"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
